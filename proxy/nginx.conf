# 把这段放进你的站点 server 块（listen 443 ssl 那段）。
# 关键：铸造页和代理必须在同一个域名下（同域），TP 才不拦。

server {
    listen 443 ssl;
    server_name 你的域名.com;   # 改成你的域名

    # SSL（用 certbot 申请证书后填实际路径）
    ssl_certificate     /etc/letsencrypt/live/你的域名.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/你的域名.com/privkey.pem;

    # 1) 静态托管铸造页：把 index.html / style.css / app.js / assets 放这个目录
    root /var/www/mint;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2) 代理 Agentic 接口到本地 Node（同域，TP 不拦）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;   # Node 监听的端口
        proxy_http_version 1.1;
        proxy_read_timeout 120s;             # 长轮询 confirm 要等很久
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
